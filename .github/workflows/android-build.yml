name: WebView Final Exact Build

on:
  push:
    branches: [webview-2.0.25-mic-scroll-clean]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"             "emulator"             "system-images;android-35;default;x86_64"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MY_CHHACHH_2.0.25_MIC_SCROLL_CLEAN
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Boot emulator and run screenshot-scroll-crash test
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT_DIR="$GITHUB_WORKSPACE/emulator-artifacts"
          mkdir -p "$ARTIFACT_DIR"

          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          mkdir -p "$ANDROID_AVD_HOME"

          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi

          rm -rf "$ANDROID_AVD_HOME/MyChhachhCI.avd" "$ANDROID_AVD_HOME/MyChhachhCI.ini"
          echo "no" | "$AVDMANAGER" create avd             --force             --name MyChhachhCI             --package "system-images;android-35;default;x86_64"             --device "pixel_6"             --path "$ANDROID_AVD_HOME/MyChhachhCI.avd"

          printf 'avd.ini.encoding=UTF-8\npath=%s/MyChhachhCI.avd\npath.rel=avd/MyChhachhCI.avd\ntarget=android-35\n'             "$ANDROID_AVD_HOME" > "$ANDROID_AVD_HOME/MyChhachhCI.ini"

          adb kill-server || true
          adb start-server

          start_emulator() {
            nohup emulator               -avd MyChhachhCI               -no-window               -noaudio               -no-boot-anim               -no-snapshot               -no-snapshot-save               -wipe-data               -gpu swiftshader_indirect               > "$ARTIFACT_DIR/emulator.log" 2>&1 &
            echo $! > "$ARTIFACT_DIR/emulator.pid"
          }

          wait_for_device() {
            local deadline=$((SECONDS + 360))
            while [ $SECONDS -lt $deadline ]; do
              adb devices -l > "$ARTIFACT_DIR/adb-devices.txt" || true
              state="$(adb get-state 2>/dev/null || true)"
              if [ "$state" = "device" ]; then
                boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
                if [ "$boot" = "1" ]; then
                  return 0
                fi
              elif [ "$state" = "offline" ]; then
                adb reconnect offline || true
                adb kill-server || true
                sleep 2
                adb start-server
              fi
              sleep 5
            done
            return 1
          }

          start_emulator
          if ! wait_for_device; then
            adb emu kill || true
            if [ -f "$ARTIFACT_DIR/emulator.pid" ]; then
              kill "$(cat "$ARTIFACT_DIR/emulator.pid")" 2>/dev/null || true
            fi
            pkill -9 -f "emulator.*MyChhachhCI" || true
            adb kill-server || true
            sleep 3
            adb start-server
            start_emulator
            wait_for_device
          fi

          adb shell input keyevent 82 || true
          adb shell wm dismiss-keyguard || true
          sleep 5
          adb install -r -t app/build/outputs/apk/debug/app-debug.apk | tee "$ARTIFACT_DIR/install.txt"

          adb logcat -c || true
          adb shell am force-stop com.mychhachh.app || true
          adb shell am start -W -n com.mychhachh.app/.MainActivity | tee "$ARTIFACT_DIR/app-launch.txt"

          sleep 15

          if ! adb shell pidof com.mychhachh.app > "$ARTIFACT_DIR/app-pid-before-scroll.txt"; then
            echo "::error::My Chhachh is not running after launch."
            exit 1
          fi

          adb shell dumpsys activity activities > "$ARTIFACT_DIR/activity-before-scroll.txt" || true

          adb shell dumpsys window windows > "$ARTIFACT_DIR/window-before-scroll.txt" || true
          if grep -qiE "isn't responding|Application Not Responding|app not responding" "$ARTIFACT_DIR/window-before-scroll.txt"; then
            echo "::error::A system ANR dialog is covering the app before scroll."
            exit 1
          fi
          adb exec-out screencap -p > "$ARTIFACT_DIR/home-screen-before-scroll.png"

          for i in 1 2 3 4 5 6; do
            adb shell input swipe 540 1750 540 520 260
            sleep 1
          done

          for i in 1 2 3 4; do
            adb shell input swipe 540 520 540 1700 260
            sleep 1
          done

          for i in 1 2 3 4 5 6; do
            adb shell input swipe 540 1750 540 520 220
            sleep 1
          done

          if ! adb shell pidof com.mychhachh.app > "$ARTIFACT_DIR/app-pid-after-scroll.txt"; then
            echo "::error::My Chhachh stopped during repeated scrolling."
            exit 1
          fi

          adb shell dumpsys activity activities > "$ARTIFACT_DIR/activity-after-scroll.txt" || true

          adb shell dumpsys window windows > "$ARTIFACT_DIR/window-after-scroll.txt" || true
          if grep -qiE "isn't responding|Application Not Responding|app not responding" "$ARTIFACT_DIR/window-after-scroll.txt"; then
            echo "::error::A system ANR dialog is covering the app after scroll."
            exit 1
          fi
          adb exec-out screencap -p > "$ARTIFACT_DIR/home-screen-after-scroll.png"
          adb logcat -d -v threadtime > "$ARTIFACT_DIR/logcat.txt" || true

          if grep -E "FATAL EXCEPTION|ANR in com\.mychhachh\.app|Process: com\.mychhachh\.app.*has died"             "$ARTIFACT_DIR/logcat.txt"; then
            echo "::error::Crash or ANR signature found for My Chhachh."
            exit 1
          fi

          if ! grep -E "mResumedActivity|topResumedActivity|ResumedActivity" "$ARTIFACT_DIR/activity-after-scroll.txt" | grep -q "com.mychhachh.app"; then
            echo "::error::My Chhachh is not the resumed activity after repeated scrolling."
            grep -E "mResumedActivity|topResumedActivity|ResumedActivity" "$ARTIFACT_DIR/activity-after-scroll.txt" || true
            exit 1
          fi

          test -s "$ARTIFACT_DIR/home-screen-before-scroll.png"
          test -s "$ARTIFACT_DIR/home-screen-after-scroll.png"

          echo "Screenshot, active-app, repeated-scroll and crash/ANR checks passed."

      - name: Upload emulator proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MY_CHHACHH_WEBVIEW_EMULATOR_PROOF
          path: emulator-artifacts/
          if-no-files-found: warn
