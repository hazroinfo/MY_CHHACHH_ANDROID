name: My Chhachh Fullscreen TWA Build

on:
  push:
    branches: [ chrome-engine-test ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my-chhachh-fullscreen-twa
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify TWA only
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "android.webkit.WebView" -n app/src/main/java
          ! grep -R "evaluateJavascript" -n app/src/main/java
          ! grep -R "createElement('style')" -n app/src/main/java
          grep -R "TrustedWebActivityIntentBuilder" -n app/src/main/java
          grep -R "CustomTabsClient" -n app/src/main/java
          grep -q 'versionName = "2.2.1"' app/build.gradle.kts

      - name: Build TWA APK and Digital Asset Links file
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)"
          fi

          "$APKSIGNER" verify --print-certs "$APK" | tee apk-cert.txt
          CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apk-cert.txt | head -1 | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g;s/:$//')"
          test -n "$CERT_SHA256"

          cat > assetlinks.json <<EOF
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "com.mychhachh.app",
                "sha256_cert_fingerprints": ["$CERT_SHA256"]
              }
            }
          ]
          EOF

          cat assetlinks.json

      - name: Upload TWA package
        uses: actions/upload-artifact@v4
        with:
          name: MY_CHHACHH_2.2.1_FULLSCREEN_TWA
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
            apk-cert.txt
            assetlinks.json
          if-no-files-found: error
