name: My Chhachh Chrome Engine Test

on:
  push:
    branches: [ chrome-engine-test ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify browser engine only
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "android.webkit.WebView" -n app/src/main/java
          ! grep -R "evaluateJavascript" -n app/src/main/java
          ! grep -R "createElement('style')" -n app/src/main/java
          grep -q 'androidx.browser:browser' app/build.gradle.kts
          grep -q 'versionName = "2.1.0"' app/build.gradle.kts

      - name: Build Chrome engine test APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MY_CHHACHH_2.1.0_CHROME_ENGINE_TEST
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
