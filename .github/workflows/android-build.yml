# trigger isolated PR emulator QA
# QA synchronized with default-branch PR validation
name: WebView Final Stable QA

on:
  push:
    branches: [ webview-final-stable ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-and-emulator-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK and emulator image
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"             "emulator"             "system-images;android-35;default;x86_64"

      - name: Build fresh APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt

      - name: Build known-smooth WebView baseline
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_SHA="230ee63d2edce41f5fcd3e09173e8be60de5eb0e"
          BASELINE_DIR="$RUNNER_TEMP/mychhachh-smooth-baseline"
          rm -rf "$BASELINE_DIR"
          git worktree add --detach "$BASELINE_DIR" "$BASELINE_SHA"

          # Add logging only so CI can prove the historical baseline loaded the live page.
          python3 - "$BASELINE_DIR/app/src/main/java/com/mychhachh/app/MainActivity.kt" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          if "import android.util.Log" not in s:
              s = s.replace("import android.provider.Settings\n", "import android.provider.Settings\nimport android.util.Log\n")
          needle = '''            @Deprecated("Deprecated in Java")
                      override fun shouldOverrideUrlLoading(view: WebView, url: String): Boolean {
                          return handleUri(Uri.parse(url))
                      }
          '''
          addition = needle + '''
                      override fun onPageFinished(view: WebView, url: String) {
                          super.onPageFinished(view, url)
                          Log.i("BaselineWebView", "PAGE_FINISHED $url")
                      }
          '''
          if "BaselineWebView" not in s:
              if needle not in s:
                  raise SystemExit("baseline WebViewClient anchor not found")
              s = s.replace(needle, addition)
          p.write_text(s)
          PY

          pushd "$BASELINE_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          popd
          cp "$BASELINE_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/known-smooth-baseline.apk"
          sha256sum "$GITHUB_WORKSPACE/known-smooth-baseline.apk" | tee "$GITHUB_WORKSPACE/baseline-sha256.txt"
          git worktree remove --force "$BASELINE_DIR"

      - name: Emulator install, live load, repeated scroll and crash checks
        shell: bash
        run: |
          set -euo pipefail
          ART="$GITHUB_WORKSPACE/emulator-artifacts"
          mkdir -p "$ART"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"

          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi

          rm -rf "$ANDROID_AVD_HOME/MyChhachhQA.avd" "$ANDROID_AVD_HOME/MyChhachhQA.ini"
          echo "no" | "$AVDMANAGER" create avd --force             --name MyChhachhQA             --package "system-images;android-35;default;x86_64"             --device "pixel_6"

          adb kill-server || true
          adb start-server

          nohup emulator             -avd MyChhachhQA             -no-window             -noaudio             -no-boot-anim             -no-snapshot             -no-snapshot-save             -wipe-data             -gpu swiftshader_indirect             -cores 4             -memory 4096             > "$ART/emulator.log" 2>&1 &
          echo $! > "$ART/emulator.pid"

          deadline=$((SECONDS + 420))
          while [ $SECONDS -lt $deadline ]; do
            state="$(adb get-state 2>/dev/null || true)"
            boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$state" = "device" ] && [ "$boot" = "1" ]; then
              break
            fi
            if [ "$state" = "offline" ]; then
              adb reconnect offline || true
            fi
            sleep 5
          done

          test "$(adb get-state)" = "device"
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb devices -l | tee "$ART/adb-devices.txt"

          # Keep radios enabled; live-site success is verified by WebView callbacks below.
          adb shell settings put global airplane_mode_on 0 || true
          adb shell svc wifi enable || true
          adb shell svc data enable || true

          # Prove emulator networking with the current candidate first. The candidate
          # logs main-frame success/failure, unlike the historical baseline APK.
          adb install -r -t app/build/outputs/apk/debug/app-debug.apk | tee "$ART/network-preflight-install.txt"
          grep -q "Success" "$ART/network-preflight-install.txt"
          preflight_ok=0
          for attempt in 1 2 3 4 5 6; do
            adb logcat -c || true
            adb shell am force-stop com.mychhachh.app || true
            adb shell am start -W -n com.mychhachh.app/.MainActivity | tee "$ART/network-preflight-launch-${attempt}.txt"
            attempt_deadline=$((SECONDS + 45))
            while [ $SECONDS -lt $attempt_deadline ]; do
              adb logcat -d -v brief -s MyChhachhWebView:I > "$ART/network-preflight-webview-${attempt}.txt" || true
              if grep -q "MAIN_FRAME_ERROR" "$ART/network-preflight-webview-${attempt}.txt"; then
                break
              fi
              if grep -q "PAGE_FINISHED https://chhachh.pages.dev" "$ART/network-preflight-webview-${attempt}.txt"; then
                preflight_ok=1
                cp "$ART/network-preflight-webview-${attempt}.txt" "$ART/network-preflight-live.txt"
                break
              fi
              sleep 3
            done
            if [ "$preflight_ok" -eq 1 ]; then
              break
            fi
            sleep 10
          done
          if [ "$preflight_ok" -ne 1 ]; then
            echo "::error::Emulator network never reached the live My Chhachh page"
            exit 1
          fi
          adb shell am force-stop com.mychhachh.app || true

          # Measure the user's known-smooth historical WebView on this exact emulator first.
          physical_size="$(adb shell wm size | tr -d '\r' | tail -1 | sed -E 's/.* ([0-9]+)x([0-9]+).*/\1 \2/')"
          read -r baseline_w baseline_h <<< "$physical_size"
          baseline_x=$((baseline_w * 99 / 100))
          baseline_low=$((baseline_h * 74 / 100))
          baseline_high=$((baseline_h * 32 / 100))

          adb uninstall com.mychhachh.app >/dev/null 2>&1 || true
          adb install -t "$GITHUB_WORKSPACE/known-smooth-baseline.apk" | tee "$ART/baseline-install.txt"
          grep -q "Success" "$ART/baseline-install.txt"

          baseline_live_ok=0
          for baseline_attempt in 1 2 3 4 5 6; do
            adb logcat -c || true
            adb shell am force-stop com.mychhachh.app || true
            adb shell am start -W -n com.mychhachh.app/.MainActivity | tee "$ART/baseline-launch-attempt-${baseline_attempt}.txt"

            baseline_deadline=$((SECONDS + 45))
            while [ $SECONDS -lt $baseline_deadline ]; do
              adb logcat -d -v brief -s BaselineWebView:I > "$ART/baseline-live-load-attempt-${baseline_attempt}.txt" || true
              if grep -q "PAGE_FINISHED https://chhachh.pages.dev" "$ART/baseline-live-load-attempt-${baseline_attempt}.txt"; then
                baseline_live_ok=1
                cp "$ART/baseline-launch-attempt-${baseline_attempt}.txt" "$ART/baseline-launch.txt"
                cp "$ART/baseline-live-load-attempt-${baseline_attempt}.txt" "$ART/baseline-live-load.txt"
                break
              fi
              sleep 3
            done
            if [ "$baseline_live_ok" -eq 1 ]; then
              break
            fi
            sleep 10
          done

          if [ "$baseline_live_ok" -ne 1 ]; then
            echo "::error::Known-smooth baseline did not load the live My Chhachh page"
            exit 1
          fi

          sleep 20
          baseline_pid="$(adb shell pidof com.mychhachh.app | tr -d '\r')"
          test -n "$baseline_pid"
          adb exec-out screencap -p > "$ART/baseline-before-scroll.png"
          adb shell dumpsys gfxinfo com.mychhachh.app reset >/dev/null 2>&1 || true

          for i in $(seq 1 8); do
            adb shell input touchscreen swipe "$baseline_x" "$baseline_low" "$baseline_x" "$baseline_high" 240
            sleep 1
            adb shell pidof com.mychhachh.app >/dev/null
          done
          for i in $(seq 1 5); do
            adb shell input touchscreen swipe "$baseline_x" "$baseline_high" "$baseline_x" "$baseline_low" 240
            sleep 1
            adb shell pidof com.mychhachh.app >/dev/null
          done
          adb exec-out screencap -p > "$ART/baseline-after-scroll.png"
          adb shell dumpsys gfxinfo com.mychhachh.app > "$ART/baseline-gfxinfo.txt" || true
          grep -E "Total frames rendered:|Janky frames:|50th percentile:|90th percentile:|95th percentile:|99th percentile:|Number Missed Vsync:|Number Slow UI thread:|Number Slow issue draw commands:|Number Frame deadline missed:" "$ART/baseline-gfxinfo.txt" > "$ART/baseline-frame-summary.txt" || true
          cat "$ART/baseline-frame-summary.txt" || true

          baseline_total="$(sed -n 's/^Total frames rendered: \([0-9][0-9]*\).*/\1/p' "$ART/baseline-frame-summary.txt" | head -1)"
          baseline_janky="$(sed -n 's/^Janky frames: \([0-9][0-9]*\).*/\1/p' "$ART/baseline-frame-summary.txt" | head -1)"
          baseline_missed="$(sed -n 's/^Number Missed Vsync: \([0-9][0-9]*\).*/\1/p' "$ART/baseline-frame-summary.txt" | head -1)"
          baseline_slow="$(sed -n 's/^Number Slow UI thread: \([0-9][0-9]*\).*/\1/p' "$ART/baseline-frame-summary.txt" | head -1)"
          baseline_deadline="$(sed -n 's/^Number Frame deadline missed: \([0-9][0-9]*\).*/\1/p' "$ART/baseline-frame-summary.txt" | head -1)"
          test -n "$baseline_total"
          test "$baseline_total" -gt 0
          test -n "$baseline_janky"
          test -n "$baseline_missed"
          test -n "$baseline_slow"
          test -n "$baseline_deadline"

          baseline_janky_pct=$((baseline_janky * 100 / baseline_total))
          baseline_missed_pct=$((baseline_missed * 100 / baseline_total))
          baseline_slow_pct=$((baseline_slow * 100 / baseline_total))
          baseline_deadline_pct=$((baseline_deadline * 100 / baseline_total))
          {
            echo "baseline_janky_pct=$baseline_janky_pct"
            echo "baseline_missed_vsync_pct=$baseline_missed_pct"
            echo "baseline_slow_ui_pct=$baseline_slow_pct"
            echo "baseline_deadline_missed_pct=$baseline_deadline_pct"
          } | tee "$ART/baseline-frame-gate.txt"

          adb shell am force-stop com.mychhachh.app || true

          # Install the fresh candidate cleanly and test it under identical conditions.
          adb uninstall com.mychhachh.app >/dev/null 2>&1 || true
          adb install -t app/build/outputs/apk/debug/app-debug.apk | tee "$ART/install.txt"
          grep -q "Success" "$ART/install.txt"

          # Retry clean launches because a freshly booted emulator can expose WebView before its network is ready.
          live_ok=0
          for attempt in 1 2 3 4 5 6; do
            adb logcat -c || true
            adb shell am force-stop com.mychhachh.app || true
            adb shell am start -W -n com.mychhachh.app/.MainActivity | tee "$ART/app-launch-attempt-${attempt}.txt"

            attempt_deadline=$((SECONDS + 45))
            while [ $SECONDS -lt $attempt_deadline ]; do
              adb logcat -d -v brief -s MyChhachhWebView:I > "$ART/webview-live-load-attempt-${attempt}.txt" || true
              # Error pages also fire PAGE_FINISHED, so a main-frame error must win.
              if grep -q "MAIN_FRAME_ERROR" "$ART/webview-live-load-attempt-${attempt}.txt"; then
                break
              fi
              if grep -q "PAGE_FINISHED https://chhachh.pages.dev" "$ART/webview-live-load-attempt-${attempt}.txt"; then
                live_ok=1
                cp "$ART/app-launch-attempt-${attempt}.txt" "$ART/app-launch.txt"
                cp "$ART/webview-live-load-attempt-${attempt}.txt" "$ART/webview-live-load.txt"
                break
              fi
              sleep 3
            done

            if [ "$live_ok" -eq 1 ]; then
              break
            fi
            sleep 10
          done

          if [ "$live_ok" -ne 1 ]; then
            echo "::error::Live My Chhachh page did not load successfully in WebView"
            for f in "$ART"/webview-live-load-attempt-*.txt; do
              echo "===== $f ====="
              cat "$f" || true
            done
            exit 1
          fi
          # Let the live page finish its initial animation/rendering before stress scrolling.
          sleep 30
          pid="$(adb shell pidof com.mychhachh.app | tr -d '\r')"
          test -n "$pid"
          echo "$pid" > "$ART/app-pid-before-scroll.txt"
          adb shell dumpsys window windows | grep -E "mCurrentFocus|mFocusedApp" | tee "$ART/focus-before.txt" || true
          adb exec-out screencap -p > "$ART/before-scroll.png"
          test -s "$ART/before-scroll.png"

          # From here on, crash/ANR and frame metrics belong only to the repeated-scroll stress test.
          adb logcat -c || true

          # Record renderer facts separately so software-emulator pressure is not confused with app main-thread work.
          {
            echo "emulator_gpu_mode=swiftshader_indirect"
            echo "ro.hardware.egl=$(adb shell getprop ro.hardware.egl | tr -d '\r')"
            echo "debug.hwui.renderer=$(adb shell getprop debug.hwui.renderer | tr -d '\r')"
            echo "ro.kernel.qemu.gles=$(adb shell getprop ro.kernel.qemu.gles | tr -d '\r')"
            adb shell dumpsys SurfaceFlinger 2>/dev/null | grep -Ei "GLES|OpenGL|Vulkan|renderer" | head -40 || true
          } | tee "$ART/renderer-proof.txt"

          adb shell dumpsys gfxinfo com.mychhachh.app reset >/dev/null 2>&1 || true

          # Keep swipe coordinates safely inside the WebView content area.
          # The old fixed y=1850 coordinate landed inside Android's navigation bar.
          physical_size="$(adb shell wm size | tr -d '\r' | tail -1 | sed -E 's/.* ([0-9]+)x([0-9]+).*/\1 \2/')"
          read -r screen_w screen_h <<< "$physical_size"
          test -n "$screen_w"
          test -n "$screen_h"
          # Scroll from the far-right page margin so feed cards cannot interpret QA swipes as clicks.
          swipe_x=$((screen_w * 99 / 100))
          swipe_low=$((screen_h * 74 / 100))
          swipe_high=$((screen_h * 32 / 100))
          echo "screen=${screen_w}x${screen_h} swipe_x=${swipe_x} low=${swipe_low} high=${swipe_high}" | tee "$ART/scroll-coordinates.txt"

          for i in $(seq 1 8); do
            adb shell input touchscreen swipe "$swipe_x" "$swipe_low" "$swipe_x" "$swipe_high" 240
            sleep 1
            adb shell pidof com.mychhachh.app >/dev/null
          done
          adb exec-out screencap -p > "$ART/after-scroll-down.png"

          for i in $(seq 1 5); do
            adb shell input touchscreen swipe "$swipe_x" "$swipe_high" "$swipe_x" "$swipe_low" 240
            sleep 1
            adb shell pidof com.mychhachh.app >/dev/null
          done
          adb exec-out screencap -p > "$ART/after-scroll-up.png"

          pid_after="$(adb shell pidof com.mychhachh.app | tr -d '\r')"
          test -n "$pid_after"
          echo "$pid_after" > "$ART/app-pid-after-scroll.txt"
          adb shell dumpsys window windows | grep -E "mCurrentFocus|mFocusedApp" | tee "$ART/focus-after.txt" || true

          adb logcat -d -v threadtime > "$ART/logcat.txt" || true
          adb logcat -d -v brief -s MyChhachhWebView:I > "$ART/webview-during-scroll.txt" || true
          adb shell dumpsys activity exit-info com.mychhachh.app > "$ART/exit-info.txt" || true
          adb shell dumpsys gfxinfo com.mychhachh.app > "$ART/gfxinfo-after-scroll.txt" || true
          grep -E "Total frames rendered:|Janky frames:|50th percentile:|90th percentile:|95th percentile:|99th percentile:|Number Missed Vsync:|Number Slow UI thread:|Number Slow issue draw commands:|Number Frame deadline missed:" "$ART/gfxinfo-after-scroll.txt" > "$ART/scroll-frame-summary.txt" || true
          cat "$ART/scroll-frame-summary.txt" || true

          total_frames="$(sed -n 's/^Total frames rendered: \([0-9][0-9]*\).*/\1/p' "$ART/scroll-frame-summary.txt" | head -1)"
          janky_frames="$(sed -n 's/^Janky frames: \([0-9][0-9]*\).*/\1/p' "$ART/scroll-frame-summary.txt" | head -1)"
          missed_vsync="$(sed -n 's/^Number Missed Vsync: \([0-9][0-9]*\).*/\1/p' "$ART/scroll-frame-summary.txt" | head -1)"
          slow_ui="$(sed -n 's/^Number Slow UI thread: \([0-9][0-9]*\).*/\1/p' "$ART/scroll-frame-summary.txt" | head -1)"
          deadline_missed="$(sed -n 's/^Number Frame deadline missed: \([0-9][0-9]*\).*/\1/p' "$ART/scroll-frame-summary.txt" | head -1)"

          if [ -z "$total_frames" ] || [ "$total_frames" -le 0 ] || [ -z "$janky_frames" ] || [ -z "$missed_vsync" ] || [ -z "$slow_ui" ] || [ -z "$deadline_missed" ]; then
            echo "::error::Scroll frame counters are missing or invalid"
            exit 1
          fi

          janky_pct=$((janky_frames * 100 / total_frames))
          missed_vsync_pct=$((missed_vsync * 100 / total_frames))
          slow_ui_pct=$((slow_ui * 100 / total_frames))
          deadline_missed_pct=$((deadline_missed * 100 / total_frames))
          {
            echo "janky_pct=$janky_pct"
            echo "missed_vsync_pct=$missed_vsync_pct"
            echo "slow_ui_pct=$slow_ui_pct"
            echo "deadline_missed_pct=$deadline_missed_pct"
          } | tee "$ART/scroll-frame-gate.txt"

          {
            if [ "$slow_ui_pct" -gt 10 ]; then
              echo "app_main_thread_bottleneck=true"
            else
              echo "app_main_thread_bottleneck=false"
            fi
            if [ "$missed_vsync_pct" -gt 15 ] && [ "$slow_ui_pct" -le 10 ]; then
              echo "renderer_or_system_pressure=true"
            else
              echo "renderer_or_system_pressure=false"
            fi
          } | tee "$ART/scroll-frame-classification.txt"

          qa_fail=0

          # A PAGE_FINISHED can arrive late for the page that was already loading.
          # A new PAGE_STARTED during the isolated scroll window is real reload/navigation evidence.
          if grep -q "PAGE_STARTED" "$ART/webview-during-scroll.txt"; then
            echo "::error::Unexpected real WebView navigation/reload started during repeated-scroll QA"
            cat "$ART/webview-during-scroll.txt" || true
            qa_fail=1
          fi

          candidate_absolute_fail=0
          if [ "$janky_pct" -gt 15 ] || [ "$missed_vsync_pct" -gt 15 ] || [ "$slow_ui_pct" -gt 10 ] || [ "$deadline_missed_pct" -gt 15 ]; then
            candidate_absolute_fail=1
          fi

          baseline_absolute_fail=0
          if [ "$baseline_janky_pct" -gt 15 ] || [ "$baseline_missed_pct" -gt 15 ] || [ "$baseline_slow_pct" -gt 10 ] || [ "$baseline_deadline_pct" -gt 15 ]; then
            baseline_absolute_fail=1
          fi

          if [ "$candidate_absolute_fail" -eq 1 ]; then
            if [ "$baseline_absolute_fail" -eq 1 ] &&
               [ "$janky_pct" -le $((baseline_janky_pct + 10)) ] &&
               [ "$missed_vsync_pct" -le $((baseline_missed_pct + 15)) ] &&
               [ "$slow_ui_pct" -le $((baseline_slow_pct + 15)) ] &&
               [ "$deadline_missed_pct" -le $((baseline_deadline_pct + 10)) ]; then
              echo "EMULATOR-LIMITED PASS: candidate is not materially worse than the user's known-smooth baseline on the same SwiftShader emulator." | tee "$ART/relative-frame-verdict.txt"
            else
              echo "::error::Candidate is materially worse than the known-smooth baseline: baseline(janky=$baseline_janky_pct%, missed=$baseline_missed_pct%, slow-ui=$baseline_slow_pct%, deadline=$baseline_deadline_pct%) candidate(janky=$janky_pct%, missed=$missed_vsync_pct%, slow-ui=$slow_ui_pct%, deadline=$deadline_missed_pct%)"
              echo "candidate_worse_than_baseline=true" | tee "$ART/relative-frame-verdict.txt"
              qa_fail=1
            fi
          else
            echo "ABSOLUTE PASS: candidate meets the strict frame gate." | tee "$ART/relative-frame-verdict.txt"
          fi

          if grep -E "FATAL EXCEPTION|ANR in com\.mychhachh\.app|Process: com\.mychhachh\.app.*has died" "$ART/logcat.txt"; then
            adb shell dumpsys activity lastanr > "$ART/lastanr.txt" 2>&1 || true
            adb shell sh -c 'ls -lt /data/anr 2>/dev/null | head -20' > "$ART/anr-files.txt" 2>&1 || true
            adb shell sh -c 'for f in /data/anr/anr_*; do echo "===== $f ====="; cat "$f"; done' > "$ART/anr-traces.txt" 2>&1 || true
            echo "::error::Crash or ANR evidence found in logcat"
            qa_fail=1
          fi

          if grep -E "REASON_CRASH|REASON_ANR" "$ART/exit-info.txt"; then
            echo "::error::Crash/ANR exit reason found"
            qa_fail=1
          fi

          if [ "$qa_fail" -ne 0 ]; then
            exit 1
          fi

          echo "PASS: install, verified live My Chhachh WebView load, process-alive, repeated scroll, frame gate, screenshots and crash/ANR checks completed."

      - name: Upload fresh APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MY_CHHACHH_WEBVIEW_FINAL_STABLE
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error

      - name: Upload emulator proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MY_CHHACHH_WEBVIEW_FINAL_STABLE_PROOF
          path: emulator-artifacts/
          if-no-files-found: warn
