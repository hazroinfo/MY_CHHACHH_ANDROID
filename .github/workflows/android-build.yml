name: Android Build

on:
  push:
    branches: [ main, webview-loader-fix, webview-final-ui-stability-20260925 ]
  pull_request:
    branches: [ webview-loader-fix ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no heavy scroll patch returned
        shell: bash
        run: |
          set -euo pipefail
          FILE="app/src/main/java/com/mychhachh/app/MainActivity.kt"
          grep -q '#mcSmoothRouteBar' "$FILE"
          grep -q '#mcSmoothV3Bar' "$FILE"
          grep -q 'topLineMaskHeight' "$FILE"
          grep -q 'RENDERER_PRIORITY_BOUND' "$FILE"
          if grep -Eq 'MutationObserver|setInterval\(|querySelectorAll\(.body \*|querySelectorAll\(.body\*' "$FILE"; then
            echo "::error::Heavy DOM scanning/observer code is present again."
            exit 1
          fi
          echo "Lightweight route-line fix verified."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"             "emulator"             "system-images;android-35;google_apis;x86_64"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MY_CHHACHH-final-webview-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Emulator install, launch and scroll smoke test
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT_DIR="$GITHUB_WORKSPACE/emulator-artifacts"
          mkdir -p "$ARTIFACT_DIR"

          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          mkdir -p "$ANDROID_AVD_HOME"

          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi

          rm -rf "$ANDROID_AVD_HOME/MyChhachhWebView.avd" "$ANDROID_AVD_HOME/MyChhachhWebView.ini"
          echo "no" | "$AVDMANAGER" create avd --force             --name MyChhachhWebView             --package "system-images;android-35;google_apis;x86_64"             --device "pixel_6"

          adb kill-server || true
          adb start-server

          nohup emulator             -avd MyChhachhWebView             -no-window             -noaudio             -no-boot-anim             -no-snapshot             -no-snapshot-save             -wipe-data             -gpu swiftshader_indirect             -dns-server 8.8.8.8,1.1.1.1             > "$ARTIFACT_DIR/emulator.log" 2>&1 &
          echo $! > "$ARTIFACT_DIR/emulator.pid"

          deadline=$((SECONDS + 360))
          while [ $SECONDS -lt $deadline ]; do
            state="$(adb get-state 2>/dev/null || true)"
            boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$state" = "device" ] && [ "$boot" = "1" ]; then
              break
            fi
            if [ "$state" = "offline" ]; then
              adb reconnect offline || true
            fi
            sleep 5
          done

          test "$(adb get-state 2>/dev/null || true)" = "device"
          test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = "1"

          echo "Emulator boot complete; launching app and validating live WebView content directly."

          adb install -r -t app/build/outputs/apk/debug/app-debug.apk | tee "$ARTIFACT_DIR/install.txt"

          PACKAGE="com.mychhachh.loaderfix"
          COMPONENT="$(adb shell cmd package resolve-activity --brief "$PACKAGE" | tail -n 1 | tr -d '\r')"
          test -n "$COMPONENT"

          adb logcat -c || true
          adb shell am force-stop "$PACKAGE" || true
          adb shell am start -W -n "$COMPONENT" | tee "$ARTIFACT_DIR/app-launch.txt"

          sleep 30
          adb shell uiautomator dump /sdcard/mychhachh-window.xml || true
          adb pull /sdcard/mychhachh-window.xml "$ARTIFACT_DIR/window-before.xml" || true
          adb exec-out screencap -p > "$ARTIFACT_DIR/before-scroll.png"

          if [ -s "$ARTIFACT_DIR/window-before.xml" ]; then
            if ! grep -Fq 'class="android.webkit.WebView"' "$ARTIFACT_DIR/window-before.xml"; then
              echo "::error::Android WebView was not present after app launch."
              cat "$ARTIFACT_DIR/window-before.xml" || true
              exit 1
            fi
          fi

          for i in 1 2 3 4 5 6; do
            adb shell input swipe 360 1550 360 450 300
            sleep 1
          done

          for i in 1 2 3; do
            adb shell input swipe 360 500 360 1450 300
            sleep 1
          done

          adb exec-out screencap -p > "$ARTIFACT_DIR/after-scroll.png"
          adb shell dumpsys gfxinfo "$PACKAGE" > "$ARTIFACT_DIR/gfxinfo.txt" || true
          adb logcat -d -v threadtime > "$ARTIFACT_DIR/logcat.txt" || true
          adb shell pidof "$PACKAGE" > "$ARTIFACT_DIR/app-pid.txt"

          if grep -Eqi "ANR in $PACKAGE|FATAL EXCEPTION.*$PACKAGE|Process: $PACKAGE.*FATAL" "$ARTIFACT_DIR/logcat.txt"; then
            echo "::error::App crash/ANR detected during launch or scroll smoke test."
            exit 1
          fi

          test -s "$ARTIFACT_DIR/before-scroll.png"
          test -s "$ARTIFACT_DIR/after-scroll.png"
          echo "Install, launch and repeated scroll smoke test passed."

      - name: Upload emulator proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MY_CHHACHH-webview-emulator-proof
          path: emulator-artifacts/
          if-no-files-found: warn
