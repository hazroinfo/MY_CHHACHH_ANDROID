name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack uploaded source archive
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f app/build.gradle.kts ]; then
            ZIP="MY_CHHACHH_ANDROID_STUDIO_NATIVE_V6_FINAL_CHECKED-1.zip"
            if [ ! -f "$ZIP" ]; then
              echo "::error::Source ZIP not found: $ZIP"
              exit 1
            fi

            rm -rf .source_unpack
            mkdir .source_unpack
            unzip -q "$ZIP" -d .source_unpack

            SRC="$(find .source_unpack -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            if [ -z "$SRC" ]; then
              echo "::error::Could not find project folder inside ZIP"
              exit 1
            fi

            rsync -a "$SRC"/ ./
            rm -rf .source_unpack "$ZIP"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Unpack Android source"
              git push
            fi
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MY_CHHACHH-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
