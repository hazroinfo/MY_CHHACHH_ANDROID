# trigger isolated PR emulator QA
# QA synchronized with default-branch PR validation
name: WebView Final Stable QA

on:
  push:
    branches: [ webview-final-stable ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-and-emulator-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK and emulator image
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"             "emulator"             "system-images;android-35;default;x86_64"

      - name: Build fresh APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt

      - name: Emulator install, live load, repeated scroll and crash checks
        shell: bash
        run: |
          set -euo pipefail
          ART="$GITHUB_WORKSPACE/emulator-artifacts"
          mkdir -p "$ART"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"

          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi

          rm -rf "$ANDROID_AVD_HOME/MyChhachhQA.avd" "$ANDROID_AVD_HOME/MyChhachhQA.ini"
          echo "no" | "$AVDMANAGER" create avd --force             --name MyChhachhQA             --package "system-images;android-35;default;x86_64"             --device "pixel_6"

          adb kill-server || true
          adb start-server

          nohup emulator             -avd MyChhachhQA             -no-window             -noaudio             -no-boot-anim             -no-snapshot             -no-snapshot-save             -wipe-data             -gpu swiftshader_indirect             -cores 4             -memory 4096             > "$ART/emulator.log" 2>&1 &
          echo $! > "$ART/emulator.pid"

          deadline=$((SECONDS + 420))
          while [ $SECONDS -lt $deadline ]; do
            state="$(adb get-state 2>/dev/null || true)"
            boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$state" = "device" ] && [ "$boot" = "1" ]; then
              break
            fi
            if [ "$state" = "offline" ]; then
              adb reconnect offline || true
            fi
            sleep 5
          done

          test "$(adb get-state)" = "device"
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb devices -l | tee "$ART/adb-devices.txt"

          # Keep radios enabled; live-site success is verified by WebView callbacks below.
          adb shell settings put global airplane_mode_on 0 || true
          adb shell svc wifi enable || true
          adb shell svc data enable || true

          adb install -r -t app/build/outputs/apk/debug/app-debug.apk | tee "$ART/install.txt"
          grep -q "Success" "$ART/install.txt"

          # Retry clean launches because a freshly booted emulator can expose WebView before its network is ready.
          live_ok=0
          for attempt in 1 2 3 4 5 6; do
            adb logcat -c || true
            adb shell am force-stop com.mychhachh.app || true
            adb shell am start -W -n com.mychhachh.app/.MainActivity | tee "$ART/app-launch-attempt-${attempt}.txt"

            attempt_deadline=$((SECONDS + 45))
            while [ $SECONDS -lt $attempt_deadline ]; do
              adb logcat -d -v brief -s MyChhachhWebView:I > "$ART/webview-live-load-attempt-${attempt}.txt" || true
              # Error pages also fire PAGE_FINISHED, so a main-frame error must win.
              if grep -q "MAIN_FRAME_ERROR" "$ART/webview-live-load-attempt-${attempt}.txt"; then
                break
              fi
              if grep -q "PAGE_FINISHED https://chhachh.pages.dev" "$ART/webview-live-load-attempt-${attempt}.txt"; then
                live_ok=1
                cp "$ART/app-launch-attempt-${attempt}.txt" "$ART/app-launch.txt"
                cp "$ART/webview-live-load-attempt-${attempt}.txt" "$ART/webview-live-load.txt"
                break
              fi
              sleep 3
            done

            if [ "$live_ok" -eq 1 ]; then
              break
            fi
            sleep 10
          done

          if [ "$live_ok" -ne 1 ]; then
            echo "::error::Live My Chhachh page did not load successfully in WebView"
            for f in "$ART"/webview-live-load-attempt-*.txt; do
              echo "===== $f ====="
              cat "$f" || true
            done
            exit 1
          fi
          # Let the live page finish its initial animation/rendering before stress scrolling.
          sleep 30
          pid="$(adb shell pidof com.mychhachh.app | tr -d '\r')"
          test -n "$pid"
          echo "$pid" > "$ART/app-pid-before-scroll.txt"
          adb shell dumpsys window windows | grep -E "mCurrentFocus|mFocusedApp" | tee "$ART/focus-before.txt" || true
          adb exec-out screencap -p > "$ART/before-scroll.png"
          test -s "$ART/before-scroll.png"

          # From here on, crash/ANR and frame metrics belong only to the repeated-scroll stress test.
          adb logcat -c || true

          # Record renderer facts separately so software-emulator pressure is not confused with app main-thread work.
          {
            echo "emulator_gpu_mode=swiftshader_indirect"
            echo "ro.hardware.egl=$(adb shell getprop ro.hardware.egl | tr -d '\r')"
            echo "debug.hwui.renderer=$(adb shell getprop debug.hwui.renderer | tr -d '\r')"
            echo "ro.kernel.qemu.gles=$(adb shell getprop ro.kernel.qemu.gles | tr -d '\r')"
            adb shell dumpsys SurfaceFlinger 2>/dev/null | grep -Ei "GLES|OpenGL|Vulkan|renderer" | head -40 || true
          } | tee "$ART/renderer-proof.txt"

          adb shell dumpsys gfxinfo com.mychhachh.app reset >/dev/null 2>&1 || true

          # Keep swipe coordinates safely inside the WebView content area.
          # The old fixed y=1850 coordinate landed inside Android's navigation bar.
          physical_size="$(adb shell wm size | tr -d '\r' | tail -1 | sed -E 's/.* ([0-9]+)x([0-9]+).*/\1 \2/')"
          read -r screen_w screen_h <<< "$physical_size"
          test -n "$screen_w"
          test -n "$screen_h"
          swipe_x=$((screen_w / 2))
          swipe_low=$((screen_h * 76 / 100))
          swipe_high=$((screen_h * 30 / 100))
          echo "screen=${screen_w}x${screen_h} swipe_x=${swipe_x} low=${swipe_low} high=${swipe_high}" | tee "$ART/scroll-coordinates.txt"

          for i in $(seq 1 8); do
            adb shell input touchscreen swipe "$swipe_x" "$swipe_low" "$swipe_x" "$swipe_high" 320
            sleep 1
            adb shell pidof com.mychhachh.app >/dev/null
          done
          adb exec-out screencap -p > "$ART/after-scroll-down.png"

          for i in $(seq 1 5); do
            adb shell input touchscreen swipe "$swipe_x" "$swipe_high" "$swipe_x" "$swipe_low" 320
            sleep 1
            adb shell pidof com.mychhachh.app >/dev/null
          done
          adb exec-out screencap -p > "$ART/after-scroll-up.png"

          pid_after="$(adb shell pidof com.mychhachh.app | tr -d '\r')"
          test -n "$pid_after"
          echo "$pid_after" > "$ART/app-pid-after-scroll.txt"
          adb shell dumpsys window windows | grep -E "mCurrentFocus|mFocusedApp" | tee "$ART/focus-after.txt" || true

          adb logcat -d -v threadtime > "$ART/logcat.txt" || true
          adb logcat -d -v brief -s MyChhachhWebView:I > "$ART/webview-during-scroll.txt" || true
          adb shell dumpsys activity exit-info com.mychhachh.app > "$ART/exit-info.txt" || true
          adb shell dumpsys gfxinfo com.mychhachh.app > "$ART/gfxinfo-after-scroll.txt" || true
          grep -E "Total frames rendered:|Janky frames:|50th percentile:|90th percentile:|95th percentile:|99th percentile:|Number Missed Vsync:|Number Slow UI thread:|Number Slow issue draw commands:|Number Frame deadline missed:" "$ART/gfxinfo-after-scroll.txt" > "$ART/scroll-frame-summary.txt" || true
          cat "$ART/scroll-frame-summary.txt" || true

          total_frames="$(sed -n 's/^Total frames rendered: \([0-9][0-9]*\).*/\1/p' "$ART/scroll-frame-summary.txt" | head -1)"
          janky_frames="$(sed -n 's/^Janky frames: \([0-9][0-9]*\).*/\1/p' "$ART/scroll-frame-summary.txt" | head -1)"
          missed_vsync="$(sed -n 's/^Number Missed Vsync: \([0-9][0-9]*\).*/\1/p' "$ART/scroll-frame-summary.txt" | head -1)"
          slow_ui="$(sed -n 's/^Number Slow UI thread: \([0-9][0-9]*\).*/\1/p' "$ART/scroll-frame-summary.txt" | head -1)"
          deadline_missed="$(sed -n 's/^Number Frame deadline missed: \([0-9][0-9]*\).*/\1/p' "$ART/scroll-frame-summary.txt" | head -1)"

          if [ -z "$total_frames" ] || [ "$total_frames" -le 0 ] || [ -z "$janky_frames" ] || [ -z "$missed_vsync" ] || [ -z "$slow_ui" ] || [ -z "$deadline_missed" ]; then
            echo "::error::Scroll frame counters are missing or invalid"
            exit 1
          fi

          janky_pct=$((janky_frames * 100 / total_frames))
          missed_vsync_pct=$((missed_vsync * 100 / total_frames))
          slow_ui_pct=$((slow_ui * 100 / total_frames))
          deadline_missed_pct=$((deadline_missed * 100 / total_frames))
          {
            echo "janky_pct=$janky_pct"
            echo "missed_vsync_pct=$missed_vsync_pct"
            echo "slow_ui_pct=$slow_ui_pct"
            echo "deadline_missed_pct=$deadline_missed_pct"
          } | tee "$ART/scroll-frame-gate.txt"

          {
            if [ "$slow_ui_pct" -gt 10 ]; then
              echo "app_main_thread_bottleneck=true"
            else
              echo "app_main_thread_bottleneck=false"
            fi
            if [ "$missed_vsync_pct" -gt 15 ] && [ "$slow_ui_pct" -le 10 ]; then
              echo "renderer_or_system_pressure=true"
            else
              echo "renderer_or_system_pressure=false"
            fi
          } | tee "$ART/scroll-frame-classification.txt"

          qa_fail=0

          # A PAGE_FINISHED can arrive late for the page that was already loading.
          # A new PAGE_STARTED during the isolated scroll window is real reload/navigation evidence.
          if grep -q "PAGE_STARTED" "$ART/webview-during-scroll.txt"; then
            echo "::error::Unexpected real WebView navigation/reload started during repeated-scroll QA"
            cat "$ART/webview-during-scroll.txt" || true
            qa_fail=1
          fi

          if [ "$janky_pct" -gt 15 ] || [ "$missed_vsync_pct" -gt 15 ] || [ "$slow_ui_pct" -gt 10 ] || [ "$deadline_missed_pct" -gt 15 ]; then
            echo "::error::Repeated-scroll smoothness gate failed: janky=$janky_pct%, missed-vsync=$missed_vsync_pct%, slow-ui=$slow_ui_pct%, deadline-missed=$deadline_missed_pct%"
            qa_fail=1
          fi

          if grep -E "FATAL EXCEPTION|ANR in com\.mychhachh\.app|Process: com\.mychhachh\.app.*has died" "$ART/logcat.txt"; then
            adb shell dumpsys activity lastanr > "$ART/lastanr.txt" 2>&1 || true
            adb shell sh -c 'ls -lt /data/anr 2>/dev/null | head -20' > "$ART/anr-files.txt" 2>&1 || true
            adb shell sh -c 'for f in /data/anr/anr_*; do echo "===== $f ====="; cat "$f"; done' > "$ART/anr-traces.txt" 2>&1 || true
            echo "::error::Crash or ANR evidence found in logcat"
            qa_fail=1
          fi

          if grep -E "REASON_CRASH|REASON_ANR" "$ART/exit-info.txt"; then
            echo "::error::Crash/ANR exit reason found"
            qa_fail=1
          fi

          if [ "$qa_fail" -ne 0 ]; then
            exit 1
          fi

          echo "PASS: install, verified live My Chhachh WebView load, process-alive, repeated scroll, frame gate, screenshots and crash/ANR checks completed."

      - name: Upload fresh APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MY_CHHACHH_WEBVIEW_FINAL_STABLE
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error

      - name: Upload emulator proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MY_CHHACHH_WEBVIEW_FINAL_STABLE_PROOF
          path: emulator-artifacts/
          if-no-files-found: warn
