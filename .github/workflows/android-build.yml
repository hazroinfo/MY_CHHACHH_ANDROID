# clean single-pass WebView 2.0.19
name: My Chhachh Smooth WebView Build

on:
  push:
    branches: [ webview-final-stable ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my-chhachh-smooth-webview-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify single smooth WebView code path
        shell: bash
        run: |
          set -euo pipefail
          test ! -d app/src/main/java/com/mychhachh/app/ui
          test ! -d app/src/main/java/com/mychhachh/app/data
          ! grep -q "org.jetbrains.kotlin.plugin.compose" app/build.gradle.kts
          ! grep -q "androidx.compose" app/build.gradle.kts
          ! grep -q "ANDROID_WEBVIEW_STABILITY_JS" app/src/main/java/com/mychhachh/app/MainActivity.kt
          grep -q 'versionName = "2.0.19"' app/build.gradle.kts
          grep -q 'android.permission.RECORD_AUDIO' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.MODIFY_AUDIO_SETTINGS' app/src/main/AndroidManifest.xml
          ! grep -q 'startupMicPermission' app/src/main/java/com/mychhachh/app/MainActivity.kt
          ! grep -q "setLayerType" app/src/main/java/com/mychhachh/app/MainActivity.kt
          ! grep -q "offscreenPreRaster" app/src/main/java/com/mychhachh/app/MainActivity.kt
          ! grep -q "setRendererPriorityPolicy" app/src/main/java/com/mychhachh/app/MainActivity.kt
          ! grep -q "querySelectorAll" app/src/main/java/com/mychhachh/app/MainActivity.kt
          test "$(grep -o "setTimeout" app/src/main/java/com/mychhachh/app/MainActivity.kt | wc -l)" -le 1
          grep -q "AUDIO_CAPTURE_COMPAT_JS" app/src/main/java/com/mychhachh/app/MainActivity.kt
          grep -q "LOADER_STYLE_JS" app/src/main/java/com/mychhachh/app/MainActivity.kt

      - name: Build clean APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MY_CHHACHH_2.0.19_SMOOTH_WEBVIEW
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
