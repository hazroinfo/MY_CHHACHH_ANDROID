name: Android Smoke Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.mychhachh.app
            adb shell am start -W -n com.mychhachh.app/.MainActivity
            sleep 8
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | grep "com.mychhachh.app"
            if adb logcat -d | grep -E "FATAL EXCEPTION|Process: com.mychhachh.app" | grep -q "com.mychhachh.app"; then
              echo "App crash detected"
              adb logcat -d | tail -n 300
              exit 1
            fi
            adb exec-out screencap -p > smoke-screen.png

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MY_CHHACHH-smoke-screen
          path: smoke-screen.png
          if-no-files-found: warn
