name: Android Emulator Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi

      - name: Build, recover ADB, launch app and capture proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euo pipefail
            chmod +x gradlew
            mkdir -p emulator-proof

            ./gradlew --no-daemon --stacktrace assembleDebug

            recover_adb() {
              adb reconnect offline || true
              adb kill-server || true
              sleep 2
              adb start-server
              sleep 2
            }

            wait_online() {
              for i in $(seq 1 72); do
                adb devices -l | tee emulator-proof/adb-devices.txt
                state="$(adb get-state 2>/dev/null || true)"
                boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"

                if [ "$state" = "device" ] && [ "$boot" = "1" ]; then
                  return 0
                fi

                if [ "$state" = "offline" ]; then
                  recover_adb
                fi
                sleep 5
              done
              return 1
            }

            if ! wait_online; then
              echo "::error::Emulator never reached usable ADB device state"
              exit 1
            fi

            adb shell input keyevent 82 || true
            adb shell wm dismiss-keyguard || true

            adb install -r -t app/build/outputs/apk/debug/app-debug.apk | tee emulator-proof/install.txt
            adb logcat -c || true
            adb shell am force-stop com.mychhachh.app || true
            adb shell am start -W -n com.mychhachh.app/.MainActivity | tee emulator-proof/launch.txt
            sleep 10

            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | tee emulator-proof/resumed.txt || true
            adb shell dumpsys window windows | grep -E "mCurrentFocus|mFocusedApp" | tee emulator-proof/window-focus.txt || true
            adb shell uiautomator dump /sdcard/mychhachh-window.xml || true
            adb pull /sdcard/mychhachh-window.xml emulator-proof/window.xml || true
            adb exec-out screencap -p > emulator-proof/home-screen.png
            adb logcat -d -v threadtime > emulator-proof/logcat.txt || true

            if ! adb shell pidof com.mychhachh.app > emulator-proof/app-pid.txt; then
              echo "::error::My Chhachh process is not alive after launch"
              exit 1
            fi

            if grep -q "FATAL EXCEPTION: main" emulator-proof/logcat.txt; then
              echo "::error::Fatal main-thread crash found in logcat"
              exit 1
            fi

            if [ ! -s emulator-proof/home-screen.png ]; then
              echo "::error::Screenshot was not created"
              exit 1
            fi

            echo "Emulator online; My Chhachh launched; screenshot captured."

      - name: Upload emulator proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MY_CHHACHH-emulator-proof
          path: emulator-proof/
          if-no-files-found: warn
