name: Build chhachh Play Store AAB
on:
  push:
    branches: [play-store-aab-2026]
    paths:
      - 'chhachh_android_canonical/app/**'
      - '.github/workflows/chhachh-native-zip-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-play-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout canonical WebView source
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            chhachh_Android_Professional_Native_Source.zip
            chhachh_android_canonical/app/src/main/java/com/chhachh/app/MainActivity.java
            chhachh_android_canonical/app/build.gradle
            chhachh_android_canonical/app/src/main/AndroidManifest.xml
          sparse-checkout-cone-mode: false
      - name: Materialize one Android source tree
        shell: bash
        run: |
          set -euo pipefail
          test -s chhachh_Android_Professional_Native_Source.zip
          mkdir -p current-chhachh-app
          unzip -q chhachh_Android_Professional_Native_Source.zip -d current-chhachh-app \
            -x 'app/src/main/java/com/chhachh/app/MainActivity.java' 'app/build.gradle' 'app/src/main/AndroidManifest.xml'
          mkdir -p current-chhachh-app/app/src/main/java/com/chhachh/app
          install -m 644 chhachh_android_canonical/app/src/main/java/com/chhachh/app/MainActivity.java current-chhachh-app/app/src/main/java/com/chhachh/app/MainActivity.java
          install -m 644 chhachh_android_canonical/app/build.gradle current-chhachh-app/app/build.gradle
          install -m 644 chhachh_android_canonical/app/src/main/AndroidManifest.xml current-chhachh-app/app/src/main/AndroidManifest.xml
          grep -q "applicationId 'com.chhachh.app'" current-chhachh-app/app/build.gradle
          grep -q 'targetSdk 36' current-chhachh-app/app/build.gradle
          find current-chhachh-app/app/src/main -name MainActivity.java -print
      - name: Use the existing approved chhachh launcher icon
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 https://chhachh.com/downloads/chhachh.apk -o /tmp/chhachh-current.apk
          echo "89ce92bb7ed2f1149423803755a4550275f5834ceb55535f47148afd74bbd9e7  /tmp/chhachh-current.apk" | sha256sum -c -
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          mapping = {
              "mipmap-mdpi": "res/9w.png",
              "mipmap-hdpi": "res/yn.png",
              "mipmap-xhdpi": "res/FS.png",
              "mipmap-xxhdpi": "res/RJ.png",
              "mipmap-xxxhdpi": "res/o-.png",
          }
          root = Path("current-chhachh-app/app/src/main/res")
          with zipfile.ZipFile("/tmp/chhachh-current.apk") as apk:
              for folder, original in mapping.items():
                  dst = root / folder / "ic_launcher.png"
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  dst.write_bytes(apk.read(original))
                  print(folder, dst.stat().st_size)
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build release AAB and debug APK
        working-directory: current-chhachh-app
        run: gradle --no-daemon --stacktrace :app:bundleRelease :app:assembleDebug
      - name: Verify bundle structure and record hashes
        shell: bash
        run: |
          set -euo pipefail
          AAB=current-chhachh-app/app/build/outputs/bundle/release/app-release.aab
          APK=current-chhachh-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$AAB"
          test -s "$APK"
          unzip -t "$AAB" | tail -1
          unzip -Z1 "$AAB" | grep -q '^base/manifest/AndroidManifest.xml$'
          unzip -Z1 "$AAB" | grep -q '^base/dex/classes.dex$'
          sha256sum "$AAB" "$APK" | tee SHA256SUMS.txt
          echo 'This Android App Bundle is UNSIGNED; it cannot be uploaded to Google Play until signed with a secure persistent upload key.' > SIGNING_REQUIRED.txt
      - name: Upload Play Bundle and test APK
        uses: actions/upload-artifact@v4
        with:
          name: chhachh-play-aab-api36-unsigned
          path: |
            current-chhachh-app/app/build/outputs/bundle/release/app-release.aab
            current-chhachh-app/app/build/outputs/apk/debug/app-debug.apk
            SHA256SUMS.txt
            SIGNING_REQUIRED.txt
          if-no-files-found: error
