name: Build current chhachh WebView APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'chhachh_android_canonical/**'
      - '.github/workflows/chhachh-native-zip-build.yml'
  push:
    branches: [main]
    paths:
      - 'chhachh_Android_Professional_Native_Source.zip'
      - '.github/workflows/chhachh-native-zip-build.yml'
      - 'chhachh_android_canonical/app/src/main/java/com/chhachh/app/MainActivity.java'
      - 'chhachh_android_canonical/app/build.gradle'
      - 'chhachh_android_canonical/app/src/main/AndroidManifest.xml'
      - 'chhachh_android_canonical/app/src/main/res/drawable-nodpi/chhachh_launcher_exact.png'
permissions:
  contents: read
jobs:
  build-current-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current source archive only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            chhachh_Android_Professional_Native_Source.zip
            chhachh_android_canonical/app/src/main/java/com/chhachh/app/MainActivity.java
            chhachh_android_canonical/app/build.gradle
            chhachh_android_canonical/app/src/main/AndroidManifest.xml
            chhachh_android_canonical/app/src/main/res/drawable-nodpi/chhachh_launcher_exact.png
          sparse-checkout-cone-mode: false
      - name: Confirm current source archive
        run: test -s chhachh_Android_Professional_Native_Source.zip
      - name: Extract standalone native project
        run: |
          mkdir -p current-chhachh-app
          # The archived activity is excluded, not overridden or compiled.
          # There is one active MainActivity implementation in the canonical GitHub source.
          unzip -q chhachh_Android_Professional_Native_Source.zip -d current-chhachh-app -x 'app/src/main/java/com/chhachh/app/MainActivity.java' 'app/build.gradle' 'app/src/main/AndroidManifest.xml'
          mkdir -p current-chhachh-app/app/src/main/java/com/chhachh/app
          install -m 644 chhachh_android_canonical/app/src/main/java/com/chhachh/app/MainActivity.java current-chhachh-app/app/src/main/java/com/chhachh/app/MainActivity.java
          install -m 644 chhachh_android_canonical/app/build.gradle current-chhachh-app/app/build.gradle
          install -m 644 chhachh_android_canonical/app/src/main/AndroidManifest.xml current-chhachh-app/app/src/main/AndroidManifest.xml
          mkdir -p current-chhachh-app/app/src/main/res/drawable-nodpi
          install -m 644 chhachh_android_canonical/app/src/main/res/drawable-nodpi/chhachh_launcher_exact.png current-chhachh-app/app/src/main/res/drawable-nodpi/chhachh_launcher_exact.png
          grep -q 'minSdk 23' current-chhachh-app/app/build.gradle
          test -f current-chhachh-app/app/src/main/java/com/chhachh/app/MainActivity.java
          test -f current-chhachh-app/app/src/main/AndroidManifest.xml
          test -f current-chhachh-app/app/build.gradle
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 SDK using runner SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build chhachh release APK without signing key
        working-directory: current-chhachh-app
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Align unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ALI="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          SRC="current-chhachh-app/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$SRC"
          "$ALI" -p -f 4 "$SRC" chhachh-release-unsigned-aligned.apk
          "$ALI" -c -p 4 chhachh-release-unsigned-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging chhachh-release-unsigned-aligned.apk | grep -E 'package:|sdkVersion:|targetSdkVersion:'
          test -s current-chhachh-app/app/build/outputs/apk/debug/app-debug.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar
          test -s apksigner.jar
      - name: Upload unsigned APK for local signing in Termux
        uses: actions/upload-artifact@v4
        with:
          name: chhachh-release-unsigned-for-termux
          path: |
            chhachh-release-unsigned-aligned.apk
            apksigner.jar
          if-no-files-found: error
      - name: Upload test APK for compatibility verification
        uses: actions/upload-artifact@v4
        with:
          name: chhachh-compatibility-debug-test
          path: current-chhachh-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-install-smoke:
    needs: build-current-native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 35]
    steps:
      - name: Download freshly built debug APK
        uses: actions/download-artifact@v4
        with:
          name: chhachh-compatibility-debug-test
          path: apks
      - name: Boot Android, install and launch chhachh
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install -r apks/app-debug.apk
            adb shell am start -W -n com.chhachh.app/.MainActivity
            sleep 4
            adb shell pidof com.chhachh.app
